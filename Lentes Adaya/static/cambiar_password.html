<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="/static/Logo%20pagina.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÓPTICALEB | Cambiar Contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0f172a;
            --bg-card: #ffffff;
            --primary-blue: #0284c7;
            --dark-blue: #0b1f36;
            --light-blue: #38bdf8;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-light: #cbd5e1;
            --success-green: #22c55e;
            --danger-red: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        header {
            background-color: var(--dark-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-img {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ffffff;
        }

        .logo-text span {
            color: var(--light-blue);
        }

        .back-link {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--light-blue);
        }

        .auth-container {
            max-width: 440px;
            width: 92%;
            margin: 25px auto;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            padding: 25px 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .auth-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark-blue);
            margin-bottom: 6px;
            text-align: center;
        }

        .auth-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary-blue);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }

        .alert-box {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
        }
        .alert-box.error { background-color: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; display: block; }
        .alert-box.success { background-color: #dcfce7; border: 1px solid #86efac; color: #166534; display: block; }

        footer {
            background-color: var(--dark-blue);
            color: #94a3b8;
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        @media (min-width: 768px) {
            header { padding: 12px 40px; }
            .logo-img { height: 38px; }
            .logo-text { font-size: 1.5rem; }
            .back-link { font-size: 0.9rem; }
            .auth-container { max-width: 440px; width: 100%; margin: 40px auto; padding: 35px; }
            .auth-title { font-size: 1.5rem; }
            .auth-subtitle { font-size: 0.85rem; }
            .form-group { margin-bottom: 16px; }
            .form-label { font-size: 0.8rem; }
            .form-input { padding: 11px 16px; }
            .btn-submit { padding: 12px; font-size: 0.95rem; }
            .alert-box { padding: 12px 16px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" onclick="window.location.href='/'">
            <img src="/static/Logo%20pagina.png" alt="Logo" class="logo-img">
            <div class="logo-text">ÓPTICA<span>LEB</span></div>
        </div>
        <a class="back-link" href="/">← Volver al Catálogo</a>
    </header>

    <div class="auth-container">
        <h2 class="auth-title">Seguridad de la Cuenta</h2>
        <p class="auth-subtitle">Actualiza tu contraseña de acceso</p>

        <div id="alertBox" class="alert-box"></div>
        
        <form id="formCambiarPassword" onsubmit="handleCambiarPassword(event)">
            <div class="form-group">
                <label class="form-label">Contraseña Actual</label>
                <input type="password" id="passwordActual" class="form-input" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label class="form-label">Nueva Contraseña</label>
                <input type="password" id="passwordNuevo" class="form-input" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Actualizar Contraseña</button>
        </form>
    </div>

    <footer>
        © 2026 ÓPTICALEB. Todos los derechos reservados.
    </footer>

    <script>
        let usuarioActual = null;

        document.addEventListener('DOMContentLoaded', () => {
            usuarioActual = JSON.parse(localStorage.getItem('optica_user'));
            if (!usuarioActual) {
                alert("Debes iniciar sesión para cambiar tu contraseña.");
                window.location.href = '/static/login_usuarios.html';
            }
        });

        async function handleCambiarPassword(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.className = 'alert-box';
            alertBox.style.display = 'none';

            const password_actual = document.getElementById('passwordActual').value;
            const password_nuevo = document.getElementById('passwordNuevo').value;

            try {
                const response = await fetch(`/api/clientes/${usuarioActual.id}/actualizar`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        password_actual,
                        password_nuevo
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.textContent = "¡Contraseña actualizada con éxito!";
                    alertBox.className = 'alert-box success';
                    document.getElementById('formCambiarPassword').reset();
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    alertBox.textContent = data.detail || "Error al actualizar la contraseña.";
                    alertBox.className = 'alert-box error';
                }
            } catch (error) {
                console.error("Error:", error);
                alertBox.textContent = "Error de conexión con el servidor.";
                alertBox.className = 'alert-box error';
            }
        }
    </script>
</body>
</html>
